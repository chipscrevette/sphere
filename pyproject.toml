[project]
name = "geosphere-mcp"
version = "0.2.0"
description = "Serveur MCP Géosphère : données SIG françaises en direct (IGN, BAN, cadastre, DVF, BDNB, DPE, GPU, Géorisques)"
requires-python = ">=3.11"
dependencies = ["mcp>=2.2,<3", "httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
geosphere-mcp = "geosphere_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: appelle les vraies API publiques (réseau requis)"]
